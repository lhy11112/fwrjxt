    <title>无人机轨迹加载（Cesium）</title>
    <!-- 引入Cesium JS库 -->
    <!-- 引入本地Cesium库 -->
    <script src="./lib/Cesium/Cesium.js"></script>
    <link rel="stylesheet" href="./lib/Cesium/Widgets/widgets.css" />
    <style>
        html, body, #cesiumContainer { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; }
        .controls {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 100;
            background: rgba(42, 42, 42, 0.8);
            color: white;
            padding: 10px;
            border-radius: 5px;
        }
        button {
            background: #0074d9;
            color: white;
            border: none;
            padding: 5px 10px;
            margin: 5px;
            border-radius: 3px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background: #0056b3;
        }
        button:disabled {
            background: #cccccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div id="cesiumContainer"></div>
    <div class="controls">
        <button id="playBtn">开始飞行</button>
        <button id="pauseBtn" disabled>暂停</button>
        <button id="resetBtn">重置</button>
        <div style="margin-top: 10px;">
            <label for="speedControl">速度: </label>
            <input type="range" id="speedControl" min="1" max="30" value="10">
            <span id="speedValue">10x</span>
        </div>
    </div>

        // 3. 数据转换
        const tracePoints = [];
        const timePoints = [];
        const headingValues = [];

        if (droneTraceData.length > 0) {
            droneTraceData.forEach(point => {
                const cartesian = window.Cesium.Cartesian3.fromDegrees(
                    point.longitude, 
                    point.latitude, 
                    point.altitude
                );
                tracePoints.push(cartesian);

                const isoTime = point.time.replace(" ", "T") + "Z";
                const julianTime = window.Cesium.JulianDate.fromIso8601(isoTime);
                timePoints.push(julianTime);
                
                headingValues.push({
                    time: julianTime,
                    value: window.Cesium.Math.toRadians(point.heading)
                });
            });

            // 4. 加载轨迹线
            viewer.entities.add({
                name: "无人机轨迹线",
                polyline: {
                    positions: tracePoints,
                    width: 3,
                    material: new window.Cesium.PolylineGlowMaterialProperty({
                        glowPower: 0.2,
                        color: window.Cesium.Color.RED.withAlpha(0.8)
                    }),
                    clampToGround: false
                }
            });

            // 5. 创建无人机模型实体
            const droneModel = viewer.entities.add({
                name: "无人机",
                position: new window.Cesium.SampledPositionProperty(),
                model: {
                uri: './wrjmodel/scene.gltf', // GLTF模型路径
                scale: 1.0, // 缩放比例，根据模型大小调整
                minimumPixelSize: 64, // 最小像素大小，确保远处也能看到
                maximumScale: 2000 // 最大缩放比例
                },
                description: new window.Cesium.CallbackProperty(function(time, result) {
                    const position = droneModel.position.getValue(time, new window.Cesium.Cartesian3());
                    if (!position) return "";
                    
                    const cartographic = window.Cesium.Cartographic.fromCartesian(position);
                    const longitude = window.Cesium.Math.toDegrees(cartographic.longitude).toFixed(6);
                    const latitude = window.Cesium.Math.toDegrees(cartographic.latitude).toFixed(6);
                    const altitude = cartographic.height.toFixed(2);
                    
                    let speed = 0;
                    let heading = 0;
                    for (let i = 0; i < timePoints.length - 1; i++) {
                        if (window.Cesium.JulianDate.greaterThanOrEquals(time, timePoints[i]) && 
                            window.Cesium.JulianDate.lessThanOrEquals(time, timePoints[i + 1])) {
                            speed = droneTraceData[i].speed;
                            heading = droneTraceData[i].heading.toFixed(2);
                            break;
                        }
                    }
                    
                    return `<b>无人机状态</b><br>
                            经度: ${longitude}<br>
                            纬度: ${latitude}<br>
                            高度: ${altitude} 米<br>
                            速度: ${speed} m/s<br>
                            航向: ${heading}°`;
                }, false)
            });

            // 6. 填充无人机位置数据
            const positionProperty = droneModel.position;
            for (let i = 0; i < tracePoints.length; i++) {
                positionProperty.addSample(timePoints[i], tracePoints[i]);
            }

            // 7. 无人机朝向控制 - 修复getVelocity错误
            const headingProperty = new window.Cesium.SampledProperty(Number);
            headingValues.forEach(h => {
                headingProperty.addSample(h.time, h.value);
            });

            // 计算两个点之间的方向向量（替代getVelocity方法）
            function getDirectionVector(time) {
                // 找到当前时间所在的时间段
                for (let i = 0; i < timePoints.length - 1; i++) {
                    if (window.Cesium.JulianDate.greaterThanOrEquals(time, timePoints[i]) && 
                        window.Cesium.JulianDate.lessThanOrEquals(time, timePoints[i + 1])) {
                        // 计算两点之间的方向向量
                        return window.Cesium.Cartesian3.subtract(
                            tracePoints[i + 1], 
                            tracePoints[i], 
                            new window.Cesium.Cartesian3()
                        );
                    }
                }
                return window.Cesium.Cartesian3.ZERO;
            }

            droneModel.orientation = new window.Cesium.CallbackProperty(function(time, result) {
                const heading = headingProperty.getValue(time);
                if (!heading) return window.Cesium.Quaternion.IDENTITY;
                
                const position = positionProperty.getValue(time);
                if (!position) return window.Cesium.Quaternion.IDENTITY;
                
                // 使用自定义方法获取方向向量，替代getVelocity
                const direction = window.Cesium.Cartesian3.normalize(
                    getDirectionVector(time), 
                    new window.Cesium.Cartesian3()
                );
                
                if (window.Cesium.Cartesian3.equals(direction, window.Cesium.Cartesian3.ZERO)) {
                    return window.Cesium.Transforms.headingPitchRollQuaternion(
                        position,
                        new window.Cesium.HeadingPitchRoll(heading, 0, 0)
                    );
                }
                
                return window.Cesium.Transforms.headingPitchRollQuaternion(
                    position,
                    new window.Cesium.HeadingPitchRoll(heading, 0, 0)
                );
            }, false);

            // 8. 加载轨迹点标记
            droneTraceData.forEach((point, index) => {
                if (index % 10 === 0) {
                    viewer.entities.add({
                        name: `轨迹点_${index}`,
                        position: tracePoints[index],
                        point: {
                            pixelSize: 6,
                            color: window.Cesium.Color.YELLOW,
                            outlineColor: window.Cesium.Color.BLACK,
                            outlineWidth: 1
                        },
                        label: {
                            text: `${index}`,
                            font: "12px sans-serif",
                            pixelOffset: new window.Cesium.Cartesian2(0, 15),
                            fillColor: window.Cesium.Color.WHITE
                        }
                    });
                }
            });

            // 9. 视角定位
            viewer.trackedEntity = droneModel;
            viewer.camera.flyTo({
                destination: window.Cesium.Cartesian3.fromDegrees(
                    droneTraceData[0].longitude,
                    droneTraceData[0].latitude,
                    droneTraceData[0].altitude + 300
                ),
                duration: 3
            });

            // 10. 设置时间轴范围
            if (timePoints.length > 0) {
                viewer.clock.startTime = timePoints[0].clone();
                viewer.clock.endTime = timePoints[timePoints.length - 1].clone();
                viewer.clock.currentTime = timePoints[0].clone();
                viewer.clock.multiplier = 10;
                viewer.clock.clockRange = window.Cesium.ClockRange.LOOP_STOP;
                
                if (viewer.timeline) {
                    viewer.timeline.zoomTo(timePoints[0], timePoints[timePoints.length - 1]);
                }
            }
        }

        // 11. 控制按钮功能
        const playBtn = document.getElementById('playBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const resetBtn = document.getElementById('resetBtn');
        const speedControl = document.getElementById('speedControl');
        const speedValue = document.getElementById('speedValue');

        playBtn.addEventListener('click', function() {
            viewer.clock.shouldAnimate = true;
            playBtn.disabled = true;
            pauseBtn.disabled = false;
        });

        pauseBtn.addEventListener('click', function() {
            viewer.clock.shouldAnimate = false;
            pauseBtn.disabled = true;
            playBtn.disabled = false;
        });

        resetBtn.addEventListener('click', function() {
            if (timePoints.length > 0) {
                viewer.clock.currentTime = timePoints[0].clone();
                viewer.clock.shouldAnimate = false;
                pauseBtn.disabled = true;
                playBtn.disabled = false;
            }
        });

        speedControl.addEventListener('input', function() {
            const speed = parseInt(this.value);
            viewer.clock.multiplier = speed;
            speedValue.textContent = `${speed}x`;
        });
    </script>
</body>
</html>
